project:
  type: book
  output-dir: _book
  resources:
    - chapters/audio/
    - output/pdf/
    - output/vtt/
  pre-render:
    - uv run sr6 sync-all

book:
  title: "VELVET // Jin-Young Character Dossier"
  author: "Velvet"
  date: "2026-06-17"
  chapters:
    - index.qmd
    - part: "Core Character"
      chapters:
        - chapters/identity_core.md
        - chapters/character_build_point_buy.qmd
        - chapters/character_sheet.qmd
        - chapters/character_totals.qmd
        - chapters/character_log.qmd
        - chapters/character_purchases.qmd
        - chapters/twenty_questions.qmd
        - chapters/character_build.qmd
        - chapters/rules_and_downtime.qmd
    - part: "Narrative Log"
      chapters:
        - chapters/01_transaction.md
        - chapters/02_faceless_mirror.md
        - chapters/03_dark_wings.md
        - chapters/04_sabotage.md
        - chapters/05_first_negotiation.md
        - chapters/06_seattle_web.md
        - chapters/07_bliss.md
        - chapters/08_Tea_in_Tacoma.md


    - part: "Reference & Specifications"
      chapters:
        - reference/voice_spec.md
        - reference/story_arc1.md
        - reference/story_arc2.md
        - reference/story_continuity.md

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    number-sections: false
    code-copy: true

execute:
  engine: jupyter
  python: .venv/Scripts/python.exe
